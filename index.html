<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11151b"><meta name="description" content="CubIQ Trainer: aprendizaje inteligente de algoritmos CFOP"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>CubIQ Trainer</title>
<style>
:root{color-scheme:dark;--bg:#10141a;--p:#1a2029;--p2:#252e3a;--line:#354151;--tx:#edf2f8;--mut:#9ba9ba;--gold:#d2a12a;--green:#53c58b;--red:#ed7777;--blue:#68b6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.48 system-ui,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--p2);color:var(--tx);border-radius:11px;padding:10px 13px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:var(--gold);color:#171717;border-color:var(--gold);font-weight:800}header{position:sticky;top:0;z-index:4;background:#10141af2;border-bottom:1px solid var(--line);padding:12px max(15px,calc((100vw - 980px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:18px}.brand em{color:var(--gold);font-style:normal}main{max-width:980px;margin:auto;padding:18px 15px 85px}.muted,.tiny{color:var(--mut)}.tiny{font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin:15px 0}.tabs button{white-space:nowrap}.tabs .on{border-color:var(--gold);color:var(--gold)}.panel{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:var(--p2);padding:10px;border-radius:12px}.stat b{font-size:22px;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.case{min-height:78px;text-align:left;display:flex;align-items:center;gap:8px}.case svg{width:48px;height:48px;flex:none}.case small{display:block;color:var(--mut)}.alg{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.mv{font:800 16px ui-monospace,monospace;padding:8px 10px;border-radius:9px;background:#303b49;border:1px solid #46566a}.mv.active{outline:3px solid var(--gold);transform:translateY(-2px)}.mv.done{opacity:.35}.chunk{border:1px solid #53647a;border-radius:12px;padding:9px;margin:7px 0;background:#202a36}.chunk strong{color:var(--gold)}.hint{border-left:3px solid var(--gold);background:#252d37;padding:10px 12px;border-radius:0 9px 9px 0;margin:12px 0}.bar{height:7px;border-radius:9px;background:#303946;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.status{padding:9px 11px;border-radius:10px;background:var(--p2);font-size:13px}.ok{color:var(--green)}.bad{color:var(--red)}.metric{font:700 24px ui-monospace,monospace}.sequence{display:flex;gap:6px;flex-wrap:wrap}.sequence button{min-width:42px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input{background:var(--p2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}footer{position:fixed;bottom:0;left:0;right:0;text-align:center;background:#10141af2;border-top:1px solid var(--line);padding:9px;color:var(--mut);font-size:12px}@media(max-width:560px){.two{grid-template-columns:1fr}.panel{padding:14px}.stats{gap:6px}.stat b{font-size:19px}}
</style></head><body>
<header><div class="brand">Cub<em>IQ</em> · Trainer 2.0</div><div class="tiny" id="cubeStatus">Cubo no conectado</div></header>
<main><div class="row between"><div><h1>Aprende, reconoce y ejecuta</h1><div class="muted">Casos reales · chunks · práctica adaptativa</div></div><button id="reset">Reiniciar</button></div>
<div class="stats"><div class="stat"><b id="due">0</b><span class="tiny">Repasos hoy</span></div><div class="stat"><b id="learning">0</b><span class="tiny">Aprendiendo</span></div><div class="stat"><b id="mastered">0</b><span class="tiny">Dominados</span></div></div>
<nav class="tabs"><button data-tab="today" class="on">Hoy</button><button data-tab="library">Biblioteca</button><button data-tab="session">Entrenar</button><button data-tab="stats">Progreso</button><button data-tab="device">Cubo</button></nav><div id="app"></div></main><footer>Progreso guardado localmente · Exporta una copia en Progreso</footer>
<script type="module">
const $=s=>document.querySelector(s), app=$('#app');
// Insight se importa después de dar oportunidad al proyecto anfitrión de registrar window.CM.
const I=await import('./insight.js');
const order=['EOLL','OCLL','F2L','CPLL','EPLL','PLL','OLL'];
const names={EOLL:'OLL de aristas',OCLL:'OLL de esquinas · 2-look',F2L:'F2L',CPLL:'PLL de esquinas · 2-look',EPLL:'PLL de aristas · 2-look',PLL:'PLL completo',OLL:'OLL completo'};
const cases=order.flatMap(kind=>Object.entries(I.GROUPS[kind]||{}).map(([id,alg])=>({key:kind+' '+id,kind,id:String(id),alg})));
const KEY='cubiq-trainer-v2';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{progress:{},chunks:{},newPerDay:3};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const day=()=>new Date().toISOString().slice(0,10);const addDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const pOf=x=>state.progress[x.key]||{stage:0,due:'',seen:0,errors:0,success:0,avgGap:0,avgExec:0};const due=()=>cases.filter(x=>pOf(x).due&&pOf(x).due<=day());
function realCase(x){try{if(typeof window.CM!=='function')return null;return I.getCase(x.kind,x.id)}catch(e){console.warn('No se pudo construir caso con el simulador',e);return null}}
function icon(x){const c=realCase(x);return c?.icon||''}
function drawCase(x){return `<button class="case" data-case="${x.key}">${icon(x)}<span><b>${x.key}</b><small>${pOf(x).stage>=5?'Dominado':pOf(x).stage?'Nivel '+pOf(x).stage:'Nuevo'}</small></span></button>`}
function chunksFor(alg){const t=alg.trim().split(/\s+/);const motifs=[['R U R\' U\'',['R','U',"R'","U'"]],['R U\' R\'',['R',"U'","R'"]],['R U R\'',['R','U',"R'"]],['R\' U\' R',['R',"U'",'R']],['F R U R\' U\' F\'',['F','R','U',"R'","U'","F'"]],['Sune',['R','U',"R'",'U','R','U2',"R'"]]];let out=[],i=0;while(i<t.length){let found=null;for(const [name,seq] of motifs){if(seq.length>1&&seq.every((v,j)=>t[i+j]===v)&&(!found||seq.length>found.seq.length))found={name,seq}}if(found){out.push({moves:found.seq,label:found.name,mnemo:mnemo(found.seq)});i+=found.seq.length;continue}let j=i+1;while(j<t.length&&j-i<3&&!motifs.some(([n,s])=>s.every((v,k)=>t[j+k]===v)))j++;let seq=t.slice(i,j);out.push({moves:seq,label:'Microbloque',mnemo:mnemo(seq)});i=j}return out}
function mnemo(seq){const words={R:'derecha',L:'izquierda',U:'arriba',D:'abajo',F:'frente',B:'fondo',M:'corte medio',E:'ecuador',S:'slice'};return seq.map(m=>{let f=m[0],v=words[f]||f;return m.endsWith('2')?'doble '+v:m.endsWith("'")?'inversa '+v:v}).join(' · ')}
let current=null,mode='understand',step=0,chunkData=[],moveTimes=[],lastMoveAt=0,goodRun=0,guide=true,session=[],si=0,deviceOff=null,caseStartAt=0,caseGaps=[];
function show(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='today')todayView();if(tab==='library')libraryView();if(tab==='stats')statsView();if(tab==='device')deviceView();if(tab==='session')sessionView()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function todayView(){let d=due(),fresh=cases.filter(x=>!pOf(x).seen).slice(0,3);app.innerHTML=`<section class="panel"><h2>Tu plan de hoy</h2><p class="muted">Recupera primero los casos vencidos. Después aprende hasta tres nuevos.</p><div class="row"><button class="primary" id="review" ${d.length?'':'disabled'}>Repasar ${d.length}</button><button id="new" ${fresh.length?'':'disabled'}>Aprender caso nuevo</button></div><p class="tiny">${d.length} repasos · ${fresh.length} nuevos disponibles</p></section><section class="panel"><h2>Prioridad</h2><div class="grid">${d.slice(0,12).map(drawCase).join('')||'<p class="muted">No tienes repasos vencidos.</p>'}</div></section>`;$('#review')?.addEventListener('click',()=>start(d));$('#new')?.addEventListener('click',()=>start(fresh));bindCases()}
function libraryView(){app.innerHTML=`<section class="panel"><h2>Biblioteca de casos</h2><div class="row"><select id="filter"><option value="all">Todas las familias</option>${order.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select><input id="q" placeholder="Buscar caso…" style="flex:1"></div><div class="grid" id="caseGrid" style="margin-top:13px"></div></section>`;const fill=()=>{$('#caseGrid').innerHTML=cases.filter(x=>($('#filter').value==='all'||x.kind===$('#filter').value)&&x.key.toLowerCase().includes($('#q').value.toLowerCase())).map(drawCase).join('');bindCases()};$('#filter').onchange=fill;$('#q').oninput=fill;fill()}
function bindCases(){app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>open(cases.find(x=>x.key===b.dataset.case)))}
function start(xs){session=[...xs].sort(()=>Math.random()-.5);si=0;next()};function next(){if(si>=session.length){app.innerHTML=`<section class="panel"><h2>Sesión terminada</h2><button class="primary" id="back">Volver</button></section>`;$('#back').onclick=()=>show('today');return}open(session[si++],true)}
function open(x,from=false){current=x;mode='understand';step=0;guide=true;goodRun=0;caseStartAt=0;caseGaps=[];chunkData=chunksFor(x.alg);render(from)}
function render(from=false){let x=current,t=x.alg.trim().split(/\s+/),p=pOf(x),rc=realCase(x),caseSvg=rc?.icon||'';
 if(mode==='understand'){app.innerHTML=`<section class="panel"><div class="row between"><span class="tiny">${names[x.kind]}</span><span class="tiny">${x.key}</span></div><h2>1 · Entender el caso</h2><div class="row">${caseSvg||'<span class="status bad">Icono real pendiente: falta cargar CM</span>'}</div><p class="muted">Este patrón solo se dibuja mediante <code>getCase()</code> y <code>caseIcon()</code> del archivo insight.js, alimentados por el simulador CubIQ. Si CM no está disponible, no se sustituye por un dibujo aproximado.</p><div class="alg">${t.map(m=>`<span class="mv">${m}</span>`).join('')}</div><h3>Chunks detectados</h3>${chunkData.map((c,i)=>`<div class="chunk"><strong>Bloque ${i+1} · ${c.label}</strong><div>${c.moves.join('　')}</div><div class="tiny">Mnemotecnia descriptiva: ${c.mnemo}</div></div>`).join('')}<p class="tiny">Los chunks son sugerencias heurísticas basadas en secuencias reconocibles; puedes editarlos después. No se presentan como significado oficial del algoritmo.</p><div class="row"><button class="primary" id="build">Construir el algoritmo</button></div></section>`;$('#build').onclick=()=>{mode='build';render(from)};
 }else if(mode==='build'){let shuffled=t.map((m,i)=>({m,i})).sort(()=>Math.random()-.5);app.innerHTML=`<section class="panel"><h2>2 · Construir</h2><p class="muted">Toca los movimientos en el orden correcto. La solución se valida contra el algoritmo original.</p><div class="sequence" id="answer"></div><div class="sequence" style="margin-top:13px">${shuffled.map(o=>`<button data-pick="${o.i}">${o.m}</button>`).join('')}</div><div class="row" style="margin-top:13px"><button id="undo">Deshacer</button><button id="check" class="primary">Comprobar</button></div><div id="feedback" class="hint"></div></section>`;let chosen=[];const refresh=()=>{$('#answer').innerHTML=chosen.map(i=>`<span class="mv">${t[i]}</span>`).join('')};app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let i=+b.dataset.pick;if(chosen.includes(i))return;chosen.push(i);b.disabled=true;refresh()});$('#undo').onclick=()=>{let i=chosen.pop();if(i!==undefined){let b=app.querySelector(`[data-pick="${i}"]`);if(b)b.disabled=false;refresh()}};$('#check').onclick=()=>{let ok=chosen.length===t.length&&chosen.every((v,i)=>v===i);$('#feedback').textContent=ok?'Correcto. Ya puedes practicar con el cubo.':'Aún no coincide. Reordena los movimientos.';$('#feedback').className='hint '+(ok?'ok':'bad');if(ok)setTimeout(()=>{mode='guided';render(from)},450)};
 }else if(mode==='guided'){app.innerHTML=`<section class="panel"><div class="row between"><h2>3 · Ejecutar con guía</h2><span class="tiny">${step}/${t.length}</span></div><p class="muted">${deviceConnected?'El cubo inteligente valida los giros recibidos.':'Modo manual: pulsa “Hecho” después de cada giro físico.'}</p><div class="alg">${t.map((m,i)=>`<span class="mv ${i===step?'active':i<step?'done':''}">${m}</span>`).join('')}</div><div class="metric">${t[step]||'✓'}</div><div class="row"><button id="done" class="primary" ${step>=t.length?'disabled':''}>Giro realizado</button><button id="skipGuide">Quitar guía</button></div><div class="status">${deviceConnected?'Esperando giro real del cubo…':`Aciertos consecutivos: ${goodRun}/3`}</div><p class="tiny">La guía se retira tras tres giros consecutivos correctos sin vacilación, medidos desde el cubo conectado. En modo manual no se infiere fluidez.</p></section>`;$('#done').onclick=()=>manualMove();$('#skipGuide').onclick=()=>{guide=false;mode='recall';render(from)};
 }else if(mode==='recall'){app.innerHTML=`<section class="panel"><h2>4 · Recuperar sin ayuda</h2><p>Intenta recordar el algoritmo completo antes de mostrar una pista.</p><div class="row"><button data-hint="${x.key}">Pista 1 · Caso</button><button data-hint="${t[0]}">Pista 2 · Primer giro</button><button data-hint="${x.alg}">Pista 3 · Algoritmo</button></div><div id="hint" class="hint" hidden></div><p>¿Cómo te ha salido?</p><div class="row"><button data-rate="fail">Fallé</button><button data-rate="hard">Con dudas</button><button data-rate="good" class="primary">Fluido</button></div></section>`;app.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{$('#hint').hidden=false;$('#hint').textContent=b.dataset.hint});app.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(x,b.dataset.rate,from));
 }
}
function manualMove(){if(step<current.alg.trim().split(/\s+/).length){step++;goodRun=0;if(step>=current.alg.trim().split(/\s+/).length){mode='recall';render()}else render()}}
function rate(x,r,from){let p=pOf(x),ints=[1,3,7,14,30,60];p.seen++;p.success=r==='good'?p.success+1:r==='hard'?p.success:0;p.stage=r==='fail'?0:r==='hard'?Math.max(1,p.stage):Math.min(6,p.stage+1);p.errors+=r==='fail'?1:0;p.due=addDays(r==='fail'?1:r==='hard'?1:ints[Math.max(0,p.stage-1)]||60);state.progress[x.key]=p;save();if(from)next();else show('today')}
function statsView(){let ps=cases.map(pOf);app.innerHTML=`<section class="panel"><h2>Progreso</h2><div class="stats"><div class="stat"><b>${ps.filter(p=>p.stage>=5).length}</b><span class="tiny">Dominados</span></div><div class="stat"><b>${ps.reduce((a,p)=>a+p.errors,0)}</b><span class="tiny">Fallos</span></div><div class="stat"><b>${ps.filter(p=>p.seen).length}</b><span class="tiny">Estudiados</span></div></div><p class="muted">La repetición espaciada ajusta el siguiente repaso según tu autoevaluación. Los tiempos reales solo se guardan cuando llega un evento del cubo inteligente.</p><div class="row"><button id="export">Exportar</button><button id="import">Importar</button><input id="file" type="file" accept="application/json" hidden></div></section><section class="panel"><h3>Calidad de los datos</h3><p class="tiny">Iconos: ${typeof window.CM==='function'?'simulador CM detectado; getCase genera los patrones reales.':'no hay CM registrado; no se dibujan patrones ficticios.'}</p><p class="tiny">Bluetooth: ${deviceConnected?'conectado':'sin conexión'}. Latencias registradas: ${moveTimes.length} en esta sesión.</p></section>`;$('#export').onclick=()=>download(JSON.stringify(state,null,2),'cubiq-progreso.json');$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());save();show('stats')}catch{alert('JSON no válido')}}}
function download(s,n){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}
// Capa de integración: no inventa UUID ni protocolo BLE. Requiere un bridge conectado al driver real de CubIQ.
let deviceConnected=false,bridge=null;
function deviceView(){app.innerHTML=`<section class="panel"><h2>Cubo inteligente</h2><div class="status" id="bleState">${deviceConnected?'Conectado':'Sin conectar'}</div><p class="muted">La app recibe giros normalizados (R, R', R2, U…). El protocolo Bluetooth depende del modelo y de la biblioteca que usa tu CubIQ; no se intenta adivinar.</p><div class="row"><button id="connect" class="primary">Conectar cubo</button><button id="disconnect">Desconectar</button></div><h3 style="margin-top:17px">Métricas en directo</h3><div class="two"><div class="stat"><b class="metric" id="lastGap">—</b><span class="tiny">Intervalo último giro</span></div><div class="stat"><b class="metric" id="hesitations">0</b><span class="tiny">Vacilaciones detectadas</span></div></div><p class="tiny">Una vacilación se marca cuando el intervalo supera max(700 ms, 2,2 × mediana reciente). Se necesitan al menos cuatro intervalos para estimar la mediana.</p><div id="bleLog" class="tiny"></div></section><section class="panel"><h3>Contrato de integración</h3><code>window.CubIQCubeBridge.connect()</code><p class="tiny">Debe devolver { disconnect, onMove(callback) }. El callback recibe { move: 'R', timestamp: performance.now() }. Consulta README-INTEGRACION.md.</p></section>`;$('#connect').onclick=connectCube;$('#disconnect').onclick=disconnectCube}
async function connectCube(){try{const mod=await import('./cube-bridge.js');bridge=await mod.connectCubiqSmartCube(onCubeMove);deviceOff=bridge.unsubscribe;deviceConnected=true;$('#cubeStatus').textContent='Cubo conectado';deviceView()}catch(e){alert('No se pudo conectar: '+e.message)}}
async function disconnectCube(){try{deviceOff?.();await bridge?.disconnect?.()}catch(e){console.warn(e)}deviceConnected=false;bridge=null;$('#cubeStatus').textContent='Cubo no conectado';deviceView()}
let intervals=[],hesitations=0,lastToken=null;
function onCubeMove(ev){let now=Number(ev.timestamp)||performance.now(),move=String(ev.move||'');if(!/^[RLUDFB](2|')?$/.test(move))return;if(!caseStartAt&&mode==='guided')caseStartAt=now;if(lastMoveAt){let gap=now-lastMoveAt;if(mode==='guided')caseGaps.push(gap);intervals.push(gap);if(intervals.length>20)intervals.shift();let sorted=[...intervals].sort((a,b)=>a-b),med=sorted[Math.floor(sorted.length/2)]||0;if(intervals.length>=4&&gap>Math.max(700,med*2.2)){hesitations++;goodRun=0}else{goodRun++;if(goodRun>=3)guide=false}moveTimes.push({move,gap,t:now});if($('#lastGap'))$('#lastGap').textContent=Math.round(gap)+' ms';if($('#hesitations'))$('#hesitations').textContent=hesitations}lastMoveAt=now;lastToken=move;if(mode==='guided'&&current){let expected=current.alg.trim().split(/\s+/)[step];if(move===expected){step++;if(step>=3&&goodRun>=3)guide=false;if(step>=current.alg.trim().split(/\s+/).length){let pp=pOf(current);pp.avgExec=caseStartAt?Math.round(now-caseStartAt):null;pp.avgGap=caseGaps.length?Math.round(caseGaps.reduce((a,b)=>a+b,0)/caseGaps.length):null;pp.hesitations=(pp.hesitations||0)+hesitations;state.progress[current.key]=pp;save();mode='recall';render()}else if(!guide){$('#app').querySelector('.status').textContent='Guía retirada: continúa de memoria.';$('#app').querySelector('.alg')?.remove();$('#app').querySelector('.metric').textContent='Continúa sin ver el algoritmo'}else render()}else{goodRun=0;$('#app').querySelector('.status').textContent=`Esperaba ${expected}; recibido ${move}. Corrige la secuencia.`}}}
function sessionView(){app.innerHTML=`<section class="panel"><h2>Entrenamiento libre</h2><p class="muted">Selecciona un caso desde la biblioteca o empieza la cola de hoy.</p><button class="primary" id="go">Ir a los repasos</button></section>`;$('#go').onclick=()=>show('today')}
$('#reset').onclick=()=>{if(confirm('¿Borrar el progreso local?')){state={progress:{},chunks:{},newPerDay:3};save();show('today')}};
function refreshStats(){$('#due').textContent=due().length;$('#learning').textContent=cases.filter(x=>pOf(x).stage>0&&pOf(x).stage<5).length;$('#mastered').textContent=cases.filter(x=>pOf(x).stage>=5).length}const oldShow=show;show=(t)=>{oldShow(t);refreshStats()};show('today');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
