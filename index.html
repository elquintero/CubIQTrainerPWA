<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11151b"><meta name="description" content="Entrenador espaciado de algoritmos CFOP para CubIQ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>CubIQ · Trainer</title>
<style>
:root{color-scheme:dark;--bg:#11151b;--panel:#1b222c;--panel2:#242d39;--line:#303b49;--text:#eef2f7;--muted:#9ba8b8;--gold:#d4a017;--blue:#53a6e8;--green:#55c68a;--red:#e47777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,select{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 14px;cursor:pointer}button.primary{background:var(--gold);border-color:var(--gold);color:#171717;font-weight:750}button:disabled{opacity:.35;cursor:not-allowed}
header{position:sticky;top:0;z-index:4;background:#11151beF;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100vw - 900px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:850;letter-spacing:.3px}.brand span{color:var(--gold)}main{max-width:900px;margin:auto;padding:18px 16px 90px}
.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 18px}.tabs button{white-space:nowrap;padding:9px 12px}.tabs .active{border-color:var(--gold);color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}h1{font-size:25px;margin:4px 0 3px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.selects{display:flex;gap:8px;flex-wrap:wrap}.selects select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
.casegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px}.case{padding:12px;text-align:left;min-height:70px}.case small{display:block;color:var(--muted);margin-top:3px}.case.done{border-color:#397c5a}
.alg{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.move{font-family:ui-monospace,monospace;font-weight:800;font-size:16px;padding:9px 10px;border-radius:9px;background:#303c4b;border:1px solid #435164;min-width:36px;text-align:center}.move:nth-child(4n+1){background:#29465a}.move:nth-child(4n+2){background:#51402a}.move:nth-child(4n+3){background:#3d3557}.move:nth-child(4n){background:#29483e}
.progress{height:7px;background:#303946;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--gold)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.options button{text-align:left}
.hint{border-left:3px solid var(--gold);padding:8px 12px;background:#262b30;border-radius:0 9px 9px 0;margin:12px 0}
.sequence{display:flex;flex-wrap:wrap;gap:7px}.slot{border:1px dashed #657386;border-radius:9px;min-width:42px;min-height:40px;padding:8px;text-align:center}.slot.filled{border-style:solid;background:#303c4b}
footer{position:fixed;bottom:0;left:0;right:0;background:#11151bf2;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:520px){main{padding:14px 12px 90px}.panel{padding:15px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:9px}.stat b{font-size:19px}.options{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="brand">Cub<span>IQ</span> <span style="color:var(--muted);font-weight:500">· Trainer</span></div><div class="tiny" id="installState">PWA · offline</div></header>
<main>
<section class="row between"><div><h1>Aprende algoritmos</h1><div class="muted">Comprende · construye · ejecuta · recupera · reconoce</div></div><button id="resetBtn">Reiniciar datos</button></section>
<div class="stats" style="margin:16px 0"><div class="stat"><b id="dueN">0</b><span class="tiny">Pendientes hoy</span></div><div class="stat"><b id="learnedN">0</b><span class="tiny">En aprendizaje</span></div><div class="stat"><b id="masterN">0</b><span class="tiny">Consolidados</span></div></div>
<nav class="tabs" id="tabs">
<button data-view="today" class="active">Hoy</button><button data-view="library">Biblioteca</button><button data-view="learn">Aprender caso</button><button data-view="stats">Progreso</button>
</nav>
<div id="app"></div>
</main><footer>Los datos se guardan en este dispositivo · Exporta una copia desde Progreso</footer>
<script type="module">
import {GROUPS} from './insight.js';
const $=s=>document.querySelector(s), app=$('#app');
const groupOrder=['EOLL','OCLL','F2L','CPLL','EPLL','PLL','OLL'];
const labels={EOLL:'OLL de aristas',OCLL:'OLL de esquinas (2-look)',F2L:'F2L',CPLL:'PLL de esquinas (2-look)',EPLL:'PLL de aristas (2-look)',PLL:'PLL completo',OLL:'OLL completo'};
const db=Object.entries(GROUPS).flatMap(([kind,obj])=>Object.entries(obj).map(([id,alg])=>({key:kind+' '+id,kind,id:String(id),alg})));
const unique=[...new Map(db.map(x=>[x.key,x])).values()];
const storeKey='cubiq-trainer-v1';
let state=JSON.parse(localStorage.getItem(storeKey)||'null')||{progress:{},daily:[],newPerDay:3,selected:null};
const save=()=>localStorage.setItem(storeKey,JSON.stringify(state));
const get=(x)=>state.progress[x.key]||{stage:0,due:0,seen:0,errors:0,recall:0,recognition:null,exec:null};
const today=()=>new Date().toISOString().slice(0,10);
const due=()=>unique.filter(x=>(get(x).due||'')<=today());
const fmtAlg=a=>a.trim().split(/\s+/);
function renderTabs(view){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}
function renderToday(){
 const d=due(), newCases=unique.filter(x=>!state.progress[x.key]).slice(0,state.newPerDay);
 app.innerHTML=`<div class="panel"><div class="row between"><h2>Tu cola de hoy</h2><span class="tiny">${today()}</span></div><p class="muted">Primero recupera lo que toca. Después incorpora hasta ${state.newPerDay} casos nuevos.</p><div class="progress"><i style="width:${Math.min(100,(unique.length-d.length)/unique.length*100)}%"></i></div><p class="tiny">${d.length} repasos pendientes · ${newCases.length} casos nuevos disponibles</p><div class="row"><button class="primary" id="startReview" ${d.length?'':'disabled'}>Empezar repasos</button><button id="startNew" ${newCases.length?'':'disabled'}>Aprender caso nuevo</button></div></div>
 <div class="panel"><h2>Orden recomendado</h2><div class="tiny">Se priorizan los repasos vencidos; el orden se mezcla para evitar aprender por bloques.</div><div class="casegrid" style="margin-top:12px">${d.slice(0,12).map(x=>`<button class="case" data-case="${x.key}">${x.key}<small>Repaso · nivel ${get(x).stage}</small></button>`).join('')||'<p class="muted">No tienes repasos pendientes.</p>'}</div></div>`;
 $('#startReview')?.addEventListener('click',()=>startSession(d,'recover'));
 $('#startNew')?.addEventListener('click',()=>startSession(newCases,'understand'));
 app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(unique.find(x=>x.key===b.dataset.case),'recover'));
}
function renderLibrary(){
 app.innerHTML=`<div class="panel"><h2>Biblioteca de algoritmos</h2><div class="selects"><select id="filter"><option value="all">Todas las familias</option>${groupOrder.map(k=>`<option value="${k}">${labels[k]}</option>`).join('')}</select><input id="search" placeholder="Buscar caso…" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;flex:1"></div><div class="casegrid" id="casegrid" style="margin-top:14px"></div></div>`;
 const fill=()=>{let kind=$('#filter').value,q=$('#search').value.toLowerCase();let xs=unique.filter(x=>(kind==='all'||x.kind===kind)&&x.key.toLowerCase().includes(q));$('#casegrid').innerHTML=xs.map(x=>`<button class="case ${get(x).stage>=5?'done':''}" data-case="${x.key}">${x.key}<small>${get(x).stage>=5?'Consolidado':get(x).stage?'Nivel '+get(x).stage:'Nuevo'}</small></button>`).join('');$('#casegrid').querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(unique.find(x=>x.key===b.dataset.case),'understand'));};
 $('#filter').onchange=fill;$('#search').oninput=fill;fill();
}
let session=[],sessionIndex=0,mode='recover',current=null,stepIndex=0,chosen=[];
function startSession(xs,m){session=[...xs].sort(()=>Math.random()-.5);sessionIndex=0;mode=m;nextSession();}
function nextSession(){if(sessionIndex>=session.length){app.innerHTML=`<div class="panel"><h2>Sesión terminada</h2><p>Has completado ${session.length} casos. La cola se actualizará según tus resultados.</p><button class="primary" id="back">Volver a Hoy</button></div>`;$('#back').onclick=()=>show('today');return;}openCase(session[sessionIndex++],mode,true);}
function openCase(x,m,fromSession=false){if(!x)return;current=x;mode=m;stepIndex=0;chosen=[];renderCase(fromSession);}
function renderCase(fromSession=false){
 const x=current, moves=fmtAlg(x.alg), p=get(x);
 if(mode==='understand'){
 app.innerHTML=`<div class="panel"><div class="row between"><span class="tiny">${labels[x.kind]||x.kind}</span><span class="tiny">${x.key}</span></div><h2>1 · Entender</h2><p class="muted">Lee el algoritmo como una secuencia de bloques. Observa qué giros se repiten y dónde cambia el patrón.</p><div class="alg">${moves.map((m,i)=>`<span class="move" title="Bloque ${i+1}">${m}</span>`).join('')}</div><div class="hint">Mnemotecnia: crea una frase o imagen propia para recordar la secuencia. La app no inventa nombres de bloques: añade tu mnemotecnia en la siguiente versión.</div><p class="tiny">${moves.length} movimientos · ${x.kind}</p><div class="row"><button id="showBuild" class="primary">Construir de memoria</button><button id="seeAgain">Volver a mirar</button></div></div>`;
 $('#showBuild').onclick=()=>{mode='build';renderCase(fromSession)};$('#seeAgain').onclick=()=>renderCase(fromSession);
 } else if(mode==='build'){
 const remaining=moves.map((m,i)=>({m,i})).sort(()=>Math.random()-.5);
 app.innerHTML=`<div class="panel"><div class="row between"><span class="tiny">${x.key}</span><span class="tiny">2 · Construir</span></div><h2>Ordena el algoritmo</h2><p class="muted">Pulsa los movimientos en el orden correcto. Si no lo recuerdas, vuelve a Entender.</p><div class="sequence" id="slots">${moves.map((_,i)=>`<div class="slot" id="s${i}">·</div>`).join('')}</div><div class="sequence" style="margin-top:15px" id="pool">${remaining.map(o=>`<button data-m="${o.i}">${o.m}</button>`).join('')}</div><div class="row" style="margin-top:15px"><button id="undo">Deshacer</button><button id="check" class="primary">Comprobar</button><button id="skip">Ver algoritmo</button></div><div id="feedback" class="tiny" style="margin-top:10px"></div></div>`;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{let i=+b.dataset.m;if(chosen.includes(i))return;chosen.push(i);b.disabled=true;$('#s'+(chosen.length-1)).textContent=moves[i];$('#s'+(chosen.length-1)).classList.add('filled');});
 $('#undo').onclick=()=>{let i=chosen.pop();if(i===undefined)return;let b=app.querySelector(`[data-m="${i}"]`);if(b)b.disabled=false;$('#s'+chosen.length).textContent='·';$('#s'+chosen.length).classList.remove('filled');};
 $('#check').onclick=()=>{let ok=chosen.length===moves.length&&chosen.every((v,i)=>v===i);$('#feedback').textContent=ok?'¡Correcto! Ahora practica la ejecución guiada.':'Aún no está en el orden correcto. Corrige la secuencia o vuelve a estudiar.';$('#feedback').style.color=ok?'var(--green)':'var(--red)';if(ok){setTimeout(()=>{mode='guided';renderCase(fromSession)},650)}};
 $('#skip').onclick=()=>{mode='guided';renderCase(fromSession)};
 } else if(mode==='guided'){
 app.innerHTML=`<div class="panel"><div class="row between"><span class="tiny">${x.key}</span><span class="tiny">3 · Ejecutar con guía</span></div><h2>Practica por bloques</h2><p class="muted">Sigue el siguiente movimiento. En esta versión, marca cada giro al realizarlo físicamente; la conexión con cubo inteligente se añadirá después.</p><div class="alg">${moves.map((m,i)=>`<span class="move" style="${i===stepIndex?'outline:3px solid var(--gold);transform:scale(1.08)':i<stepIndex?'opacity:.35':''}">${m}</span>`).join('')}</div><h1 style="color:var(--gold);font-family:monospace">${moves[stepIndex]||'✓'}</h1><div class="row"><button id="prev">Anterior</button><button id="next" class="primary">${stepIndex===moves.length-1?'Terminar':'Siguiente giro'}</button></div><p class="tiny">Aciertos consecutivos: ${Math.min(stepIndex+1,3)} / 3 para retirar la guía.</p></div>`;
 $('#prev').onclick=()=>{stepIndex=Math.max(0,stepIndex-1);renderCase(fromSession)};$('#next').onclick=()=>{if(stepIndex<moves.length-1){stepIndex++;renderCase(fromSession)}else{mode='recover';renderCase(fromSession)}};
 } else if(mode==='recover'){
 app.innerHTML=`<div class="panel"><div class="row between"><span class="tiny">${x.key}</span><span class="tiny">4 · Recuperar sin ayuda</span></div><h2>Recuerda el algoritmo</h2><p class="muted">Intenta decirlo o ejecutarlo antes de pedir una pista.</p><div class="row"><button id="hint1">Pista 1 · Nombre</button><button id="hint2">Pista 2 · Primer bloque</button><button id="hint3">Pista 3 · Algoritmo</button></div><div id="hintArea" class="hint" style="display:none"></div><div style="margin-top:16px"><p>¿Cómo te ha salido?</p><div class="row"><button data-rate="fail">Fallé</button><button data-rate="hard">Dudé</button><button data-rate="good">Fluido</button></div></div></div>`;
 $('#hint1').onclick=()=>showHint(x.key);$('#hint2').onclick=()=>showHint(moves[0]);$('#hint3').onclick=()=>showHint(x.alg);
 app.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(x,b.dataset.rate,fromSession));
 } else if(mode==='recognize'){
 app.innerHTML=`<div class="panel"><span class="tiny">5 · Reconocer</span><h2>Reconocimiento rápido</h2><p class="muted">El algoritmo aparece durante un instante; identifica el caso sin ejecutarlo.</p><div id="flash" class="alg">${moves.map(m=>`<span class="move">${m}</span>`).join('')}</div><button id="flashBtn" class="primary">Ocultar y responder</button><div id="answers"></div></div>`;
 $('#flashBtn').onclick=()=>{ $('#flash').style.visibility='hidden';$('#flashBtn').disabled=true;let choices=[x,...unique.filter(y=>y.key!==x.key).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$('#answers').innerHTML=choices.map(y=>`<button style="display:block;width:100%;margin:6px 0" data-answer="${y.key}">${y.key}</button>`).join('');$('#answers').querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let ok=b.dataset.answer===x.key;$('#answers').innerHTML=ok?'<p style="color:var(--green)">Correcto</p>':'<p style="color:var(--red)">No era ese caso</p>';rate(x,ok?'good':'fail',fromSession);});};
 }
}
function showHint(t){let a=$('#hintArea');a.style.display='block';a.textContent=t;}
function rate(x,r,fromSession){
 let p=get(x),intervals=[1,3,7,14,30,60];p.seen++;p.recall=r==='good'?Math.min(5,p.recall+1):r==='hard'?Math.max(0,p.recall):0;
 if(r==='fail'){p.errors++;p.stage=0;p.due=addDays(1)}else if(r==='hard'){p.stage=Math.max(1,p.stage);p.due=addDays(1)}else{p.stage=Math.min(6,p.stage+1);p.due=addDays(intervals[Math.max(0,p.stage-1)]||60)}
 state.progress[x.key]=p;save();
 if(fromSession)nextSession();else show('today');
}
function addDays(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function show(view){renderTabs(view);if(view==='today')renderToday();if(view==='library')renderLibrary();if(view==='learn')renderLearn();if(view==='stats')renderStats();}
function renderLearn(){app.innerHTML=`<div class="panel"><h2>Selecciona un caso para aprender</h2><p class="muted">Empieza por EOLL y OCLL, después F2L, PLL y finalmente OLL completo.</p><div class="casegrid">${unique.filter(x=>!state.progress[x.key]).slice(0,40).map(x=>`<button class="case" data-case="${x.key}">${x.key}<small>${labels[x.kind]||x.kind}</small></button>`).join('')}</div></div>`;app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(unique.find(x=>x.key===b.dataset.case),'understand'));}
function renderStats(){let all=unique.map(get),master=all.filter(p=>p.stage>=5).length,learn=all.filter(p=>p.stage>0&&p.stage<5).length;app.innerHTML=`<div class="panel"><h2>Tu progreso</h2><div class="stats"><div class="stat"><b>${master}</b><span class="tiny">Consolidados</span></div><div class="stat"><b>${learn}</b><span class="tiny">En aprendizaje</span></div><div class="stat"><b>${all.reduce((a,p)=>a+p.errors,0)}</b><span class="tiny">Fallos registrados</span></div></div><p class="muted" style="margin-top:14px">El sistema mide recuerdo mediante autoevaluación y aplica intervalos de 1, 3, 7, 14, 30 y 60 días. El tiempo de ejecución y la latencia real de reconocimiento aún no se miden.</p><div class="row"><button id="export">Exportar progreso</button><button id="import">Importar progreso</button><input id="file" type="file" accept="application/json" hidden></div></div><div class="panel"><h2>Limitaciones de esta versión</h2><ul class="muted"><li>Incluye algoritmos y casos de <code>GROUPS</code> del archivo insight.js.</li><li>Los iconos reales de OLL/PLL dependen del simulador CM; no se inventan diagramas.</li><li>No hay conexión con cubo inteligente ni medición de pausas entre giros.</li><li>Los chunks y mnemotecnias todavía son manuales; puedes añadirlos caso a caso en una futura iteración.</li></ul></div>`;
 $('#export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cubiq-progreso.json';a.click();URL.revokeObjectURL(a.href)};
 $('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{state=JSON.parse(await e.target.files[0].text());save();show('stats')}catch{alert('Archivo no válido')}};
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#resetBtn').onclick=()=>{if(confirm('¿Borrar todo el progreso guardado en este dispositivo?')){state={progress:{},daily:[],newPerDay:3,selected:null};save();show('today')}};
$('#dueN').textContent=due().length;$('#learnedN').textContent=unique.filter(x=>get(x).stage>0&&get(x).stage<5).length;$('#masterN').textContent=unique.filter(x=>get(x).stage>=5).length;
show('today');
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
