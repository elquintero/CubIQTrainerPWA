</style></head><body>
<header><div class="brand">Cub<em>IQ</em> · Trainer 3.0</div><div class="tiny" id="cubeStatus">Entrenamiento local</div></header>
<main><div class="row between"><div><h1>Aprende a reconocer, recordar y ejecutar</h1><div class="muted">Entrenamiento cognitivo CFOP · progreso local</div></div><button id="reset">Reiniciar</button></div>
<div class="stats"><div class="stat"><b id="due">0</b><span class="tiny">Repasos hoy</span></div><div class="stat"><b id="recognition">—</b><span class="tiny">Acierto reconocimiento</span></div><div class="stat"><b id="recall">—</b><span class="tiny">Recuerdo completo</span></div><div class="stat"><b id="mastered">0</b><span class="tiny">Casos consolidados</span></div></div>
<nav class="tabs"><button data-tab="today" class="on">Hoy</button><button data-tab="library">Biblioteca</button><button data-tab="train">Entrenar</button><button data-tab="stats">Progreso</button></nav><div id="app"></div></main><footer>Motor original CubIQ integrado · Datos guardados en este dispositivo</footer>
<script type="module">
const $=s=>document.querySelector(s),app=$('#app');
// Motor y análisis originales de CubIQ 1.34.16. CM es un objeto API, no una función.
import * as Engine from './cube-engine.js';
const CUBIQ_COLORS={U:'#f2f2f2',D:'#ffd500',F:'#1faa59',B:'#2a6fdb',R:'#d93a2b',L:'#ff8a1f'};
const CM={...Engine,COL:CUBIQ_COLORS};
globalThis.CM=CM;
window.CM=CM;
const I=await import('./insight.js');
const order=['EOLL','OCLL','F2L','CPLL','EPLL','PLL','OLL'];
const names={EOLL:'OLL de aristas',OCLL:'OLL de esquinas · 2-look',F2L:'F2L',CPLL:'PLL de esquinas · 2-look',EPLL:'PLL de aristas · 2-look',PLL:'PLL completo',OLL:'OLL completo'};
const cases=order.flatMap(kind=>Object.entries(I.GROUPS[kind]||{}).map(([id,alg])=>({key:kind+' '+id,kind,id:String(id),alg})));
const KEY='cubiq-trainer-v3';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};state ||= {version:3,progress:{},events:[],relations:{},newPerDay:3};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const today=()=>new Date().toISOString().slice(0,10);const plusDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const blank=()=>({stage:0,due:'',seen:0,recognitionAttempts:0,recognitionCorrect:0,recognitionMs:[],recallAttempts:0,recallComplete:0,execMs:[],chunkStats:{},errors:0,success:0,lastMode:'',updated:0});
const pOf=x=>state.progress[x.key]||blank();const due=()=>cases.filter(x=>pOf(x).due&&pOf(x).due<=today());
const caseCache=new Map();
function realCase(x){if(caseCache.has(x.key))return caseCache.get(x.key);try{if(!window.CM||typeof window.CM.solvedCube!=='function')return null;const c=I.getCase(x.kind,x.id);caseCache.set(x.key,c);return c}catch(e){console.warn('Error al generar el caso real de CubIQ:',e);return null}}
function icon(x){return realCase(x)?.icon||''}const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawCase(x){let p=pOf(x);return `<button class="case" data-case="${escape(x.key)}">${icon(x)}<span><b>${escape(x.key)}</b><small>${p.stage>=5?'Consolidado':p.seen?'En aprendizaje':'Nuevo'}</small></span></button>`}
function parseAlg(a){return String(a).trim().split(/\s+/).filter(Boolean)}
function tokenize(a){return parseAlg(a).join(' ')}
function chunksFor(alg){const t=parseAlg(alg),patterns=[['Sexy move',['R','U',"R'","U'"]],['Sune',['R','U',"R'",'U','R','U2',"R'"]],['Inserción derecha',['R','U',"R'"]],['Inserción izquierda',["L'", "U'",'L']],['Flick frontal',['F','R','U',"R'","U'","F'"]],['M slice',['M','U','M\'']]];let out=[],i=0;while(i<t.length){let found=patterns.filter(([,s])=>s.every((v,j)=>t[i+j]===v)).sort((a,b)=>b[1].length-a[1].length)[0];if(found){out.push({label:found[0],moves:found[1]});i+=found[1].length;continue}let j=i+1;while(j<t.length&&j-i<3&&!patterns.some(([,s])=>s.every((v,k)=>t[j+k]===v)))j++;out.push({label:'Bloque corto',moves:t.slice(i,j)});i=j}return out}
function similar(x){let same=cases.filter(y=>y.kind===x.kind&&y.key!==x.key);let p=cases.indexOf(x);return same.sort((a,b)=>Math.abs(cases.indexOf(a)-p)-Math.abs(cases.indexOf(b)-p)).slice(0,5)}
function candidates(x){let pool=similar(x).sort(()=>Math.random()-.5).slice(0,3);return [...pool,x].sort(()=>Math.random()-.5)}
let current=null,phase='recognize',phaseStart=0,recognitionShown=false,recognitionDone=false,recallName='',recallChunks='',recallAlg='',execChunks=[],chunkIndex=0,chunkStart=0,chunkResults=[],session=[],sessionIndex=0,sourceTab='today',derivedFrom=null;
function show(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='today')todayView();if(tab==='library')libraryView();if(tab==='stats')statsView();if(tab==='train')trainView();refreshStats()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function todayView(){const d=due(),fresh=cases.filter(x=>!pOf(x).seen).slice(0,3),weak=weakCases();app.innerHTML=`<section class="panel"><h2>Tu siguiente entrenamiento</h2><p class="muted">La app prioriza la habilidad que más necesita trabajo: reconocer, recordar o ejecutar.</p><div class="row"><button class="primary" id="adaptive">Entrenamiento adaptativo</button><button id="review" ${d.length?'':'disabled'}>Repasar vencidos (${d.length})</button></div><p class="tiny">${weak.length?`Prioridad detectada: ${weak[0].reason}.`:'Aún no hay suficientes datos; empezaremos con reconocimiento.'}</p></section><section class="panel"><h2>Casos pendientes</h2><div class="grid">${d.slice(0,12).map(drawCase).join('')||'<p class="muted">No tienes repasos vencidos.</p>'}</div></section><section class="panel"><h2>Aprender un caso nuevo</h2><div class="grid">${fresh.slice(0,9).map(drawCase).join('')||'<p class="muted">Ya has iniciado todos los casos.</p>'}</div></section>`;$('#adaptive').onclick=()=>startAdaptive();$('#review').onclick=()=>startSession(d);bindCases()}
function libraryView(){app.innerHTML=`<section class="panel"><h2>Biblioteca CFOP</h2><div class="row"><select id="filter"><option value="all">Todas las familias</option>${order.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select><input id="q" placeholder="Buscar caso…" style="flex:1"></div><div class="grid" id="caseGrid" style="margin-top:13px"></div></section>`;const fill=()=>{$('#caseGrid').innerHTML=cases.filter(x=>($('#filter').value==='all'||x.kind===$('#filter').value)&&x.key.toLowerCase().includes($('#q').value.toLowerCase())).map(drawCase).join('');bindCases()};$('#filter').onchange=fill;$('#q').oninput=fill;fill()}
function bindCases(){app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(cases.find(x=>x.key===b.dataset.case)))}
function trainView(){app.innerHTML=`<section class="panel"><h2>Entrenamiento por habilidad</h2><p class="muted">Escoge un caso de la biblioteca o deja que CubIQ seleccione el ejercicio más útil.</p><div class="row"><button class="primary" id="goAdaptive">Elegir por mí</button><button id="goInterleave">Intercalar casos de una familia</button></div></section><section class="panel"><h3>Qué entrena cada fase</h3><p><b>Reconocimiento</b> · identificar el patrón sin verlo.</p><p><b>Recuperación</b> · recordar nombre, chunks y algoritmo.</p><p><b>Derivación</b> · reconstruir un algoritmo desde otro relacionado.</p><p><b>Ejecución</b> · medir fluidez bloque a bloque.</p></section>`;$('#goAdaptive').onclick=startAdaptive;$('#goInterleave').onclick=()=>{let seed=cases.find(x=>pOf(x).seen)||cases[0];let pool=cases.filter(x=>x.kind===seed.kind).sort(()=>Math.random()-.5).slice(0,8);startSession(pool)}}
function openCase(x){current=x;session=[];sessionIndex=0;derivedFrom=null;startFlow()}
function startFlow(){phase='recognize';recognitionShown=true;recognitionDone=false;phaseStart=performance.now();renderPhase()}
function startSession(xs){session=[...xs].sort(()=>Math.random()-.5);sessionIndex=0;nextSession()}
function nextSession(){if(sessionIndex>=session.length){app.innerHTML=`<section class="panel"><h2>Sesión terminada</h2><p>Se han guardado tus resultados.</p><button class="primary" id="back">Volver a Hoy</button></section>`;$('#back').onclick=()=>show('today');refreshStats();return}current=session[sessionIndex++];derivedFrom=null;startFlow()}
function finishCase(){let p=pOf(current);p.seen++;p.updated=Date.now();p.lastMode='complete';let score=(p.recognitionCorrect/Math.max(1,p.recognitionAttempts));let recall=(p.recallComplete/Math.max(1,p.recallAttempts));let recentExec=p.execMs.slice(-5),fast=recentExec.length&&recentExec.every(v=>v<2500);p.stage=(score>=.8&&recall>=.7&&fast)?Math.min(6,p.stage+1):Math.max(0,p.stage);let interval=[1,2,4,7,14,30,60][p.stage]||1;p.due=plusDays(interval);state.progress[current.key]=p;save();if(session.length)nextSession();else show('today')}
function renderPhase(){if(!current)return;const p=pOf(current),t=parseAlg(current.alg),chunks=chunksFor(current.alg),rc=realCase(current),svg=icon(current),pattern=svg|| (rc?.pair?`<div style="text-align:center"><b>${escape(current.key)} · pareja F2L</b><p class="tiny">Esquina: ${escape(rc.pair[0])}</p><p class="tiny">Arista: ${escape(rc.pair[1])}</p><p class="tiny">Estado calculado por el motor original de CubIQ</p></div>`:`<div class="muted" style="text-align:center"><b>${escape(current.key)}</b><p class="tiny">No hay icono 2D definido para este tipo de caso en el análisis original.</p></div>`);
 if(phase==='recognize'){let opts=candidates(current);app.innerHTML=`<section class="panel"><div class="row between"><h2>1 · Memoria de reconocimiento</h2><span class="tiny">${session.length?sessionIndex+'/'+session.length:'Caso individual'}</span></div><p class="muted">Observa el patrón durante 1,5 segundos. Después desaparecerá y tendrás que identificarlo.</p><div class="pattern" id="pattern">${pattern}</div><div class="bar"><i id="timerBar" style="width:100%"></i></div><div id="recognitionChoices" class="grid" style="margin-top:12px" hidden></div><div class="tiny" id="recognitionMsg">Memoriza la forma y la orientación.</div></section>`;let start=performance.now();const bar=$('#timerBar');let duration=1500;const tick=()=>{let elapsed=performance.now()-start;bar.style.width=Math.max(0,100-elapsed/duration*100)+'%';if(elapsed>=duration){$('#pattern').innerHTML='<span class="muted">Patrón oculto</span>';$('#recognitionChoices').hidden=false;$('#recognitionChoices').innerHTML=opts.map(o=>`<button class="choice" data-rec="${escape(o.key)}">${icon(o)}<span>${escape(o.key)}</span></button>`).join('');$('#recognitionMsg').textContent='¿Qué caso acabas de ver?';$('#recognitionChoices').querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>answerRecognition(b.dataset.rec,performance.now()-start));return}requestAnimationFrame(tick)};requestAnimationFrame(tick);
 }else if(phase==='recall'){app.innerHTML=`<section class="panel"><h2>2 · Memoria de recuperación</h2><p class="muted">Sin pistas. Escribe lo que recuerdas; puedes dejar campos vacíos si no lo sabes.</p><div class="pattern">${pattern}</div><label class="tiny">Nombre del caso</label><input id="recName" style="width:100%" placeholder="Ej. T-perm, Sune…"><label class="tiny">Chunks o bloques (separados por comas)</label><input id="recChunks" style="width:100%" placeholder="Ej. Sexy move, inserción…"><label class="tiny">Algoritmo completo</label><textarea id="recAlg" placeholder="Escribe los movimientos en notación Singmaster"></textarea><div class="row"><button class="primary" id="checkRecall">Comprobar recuerdo</button><button id="skipRecall">No lo recuerdo</button></div><div id="recFeedback"></div></section>`;$('#checkRecall').onclick=checkRecall;$('#skipRecall').onclick=()=>{pOf(current).recallAttempts++;pOf(current).errors++;state.progress[current.key]=pOf(current);save();phase='derive';renderPhase()};
 }else if(phase==='derive'){let opts=derivationOptions(current);app.innerHTML=`<section class="panel"><h2>3 · Derivación de algoritmos</h2><p class="muted">En lugar de memorizarlo desde cero, comprueba si puedes reconstruirlo desde un algoritmo relacionado.</p>${opts.length?opts.map(o=>`<div class="chunk"><b>${escape(o.label)}</b><p class="tiny">Caso de partida: ${escape(o.from.key)}</p><p class="tiny">Transformación: ${escape(o.type)}</p><button data-derive="${escape(o.from.key)}|${o.type}">Intentar derivarlo</button></div>`).join(''):'<div class="hint">No hay todavía una relación inversa/espejo verificada para este caso. No vamos a inventarla. Puedes continuar y practicar la ejecución.</div>'}<button class="primary" id="toExec">Continuar a ejecución</button></section>`;app.querySelectorAll('[data-derive]').forEach(b=>b.onclick=()=>{let [key,type]=b.dataset.derive.split('|');derivedFrom={from:cases.find(x=>x.key===key),type};phase='deriveAttempt';renderPhase()});$('#toExec').onclick=beginExecution;
 }else if(phase==='deriveAttempt'){let from=derivedFrom.from,derived=transformAlg(from.alg,derivedFrom.type);app.innerHTML=`<section class="panel"><h2>Deriva ${escape(current.key)}</h2><p class="muted">Partimos de ${escape(from.key)}. Aplica la transformación <b>${escape(derivedFrom.type)}</b> y escribe el resultado sin mirar la solución.</p><div class="chunk"><b>Algoritmo conocido</b><div class="alg">${parseAlg(from.alg).map(m=>`<span class="mv">${m}</span>`).join('')}</div></div><textarea id="derivedAnswer" placeholder="Tu algoritmo derivado…"></textarea><div class="row"><button class="primary" id="checkDerived">Comprobar</button><button id="cancelDerived">Volver</button></div><div id="derivedFeedback"></div></section>`;$('#checkDerived').onclick=()=>{let val=normalizeAlg($('#derivedAnswer').value),ok=derived&&val===normalizeAlg(derived);$('#derivedFeedback').innerHTML=ok?'<p class="ok">Correcto: has aplicado la transformación algebraica.</p>':`<p class="bad">Todavía no coincide. ${derived?'Puedes revisar el resultado esperado: '+escape(derived):'No se puede calcular esta transformación.'}</p>`;if(ok){pOf(current).derivedSuccess=(pOf(current).derivedSuccess||0)+1;state.progress[current.key]=pOf(current);save()}};$('#cancelDerived').onclick=()=>{phase='derive';renderPhase()};
 }else if(phase==='execute'){execChunks=chunks;chunkIndex=0;chunkResults=[];showChunk();}
}
function answerRecognition(key,ms){let p=pOf(current);p.recognitionAttempts++;let ok=key===current.key;if(ok){p.recognitionCorrect++;p.recognitionMs.push(Math.round(ms-1500));if(p.recognitionMs.length>30)p.recognitionMs.shift()}else p.errors++;state.progress[current.key]=p;save();recognitionDone=true;app.querySelector('#recognitionChoices').innerHTML=`<div class="status ${ok?'ok':'bad'}">${ok?'Correcto.':'No era ese caso.'} ${escape(current.key)} · ${Math.round(ms-1500)} ms para responder.</div><button class="primary" id="nextRecall">Continuar</button>`;$('#nextRecall').onclick=()=>{phase='recall';renderPhase()}}
function checkRecall(){let name=$('#recName').value.trim(),chunkText=$('#recChunks').value.trim(),alg=$('#recAlg').value.trim(),p=pOf(current);p.recallAttempts++;let nameOK=normalizeText(name)===normalizeText(current.key)||normalizeText(name)===normalizeText(current.id);let expectedChunks=chunksFor(current.alg).map(c=>c.label.toLowerCase());let submitted=chunkText.toLowerCase().split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);let chunkScore=submitted.length?submitted.filter(s=>expectedChunks.some(e=>e===s||e.includes(s)||s.includes(e))).length/expectedChunks.length:0;let algOK=normalizeAlg(alg)===normalizeAlg(current.alg);let full=nameOK&&chunkScore>=.6&&algOK;if(full)p.recallComplete++;else p.errors++;state.progress[current.key]=p;save();$('#recFeedback').innerHTML=`<div class="hint"><p>Nombre: <b class="${nameOK?'ok':'bad'}">${nameOK?'correcto':'no coincide'}</b></p><p>Chunks: <b>${Math.round(chunkScore*100)}%</b></p><p>Algoritmo: <b class="${algOK?'ok':'bad'}">${algOK?'correcto':'hay diferencias'}</b></p><p class="tiny">Solución: ${escape(current.key)} · ${escape(chunksFor(current.alg).map(c=>c.label).join(' → '))}</p></div><button class="primary" id="afterRecall">Continuar</button>`;$('#afterRecall').onclick=()=>{phase='derive';renderPhase()}}
function normalizeText(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function normalizeAlg(s){return tokenize(s).replace(/\s+/g,' ').trim()}
function transformAlg(alg,type){let t=parseAlg(alg);if(type==='inversa')return t.reverse().map(invertMove).join(' ');if(type==='espejo R-L')return t.map(m=>{let f=m[0],sw=f==='R'?'L':f==='L'?'R':f;return invertMove(sw+m.slice(1))}).join(' ');return null}
function invertMove(m){let f=m[0],s=m.slice(1);return s==='2'?m:s==="'"?f:f+"'"}
function derivationOptions(x){let out=[];for(const from of cases){if(from.key===x.key)continue;for(const type of ['inversa','espejo R-L']){const derived=transformAlg(from.alg,type);if(derived&&normalizeAlg(derived)===normalizeAlg(x.alg))out.push({from,type,label:'Coincidencia algebraica exacta'})}}for(const rel of Object.values(state.relations)){if(rel.to===x.key){let from=cases.find(c=>c.key===rel.from);if(from&&!out.some(o=>o.from.key===from.key&&o.type===rel.type))out.push({from,type:rel.type,label:rel.label||'Relación configurada'})}}return out}
function beginExecution(){phase='execute';execChunks=chunksFor(current.alg);chunkIndex=0;chunkResults=[];showChunk()}
function showChunk(){let p=execChunks[chunkIndex];if(!p){phase='done';finishExecution();return}chunkStart=performance.now();app.innerHTML=`<section class="panel"><div class="row between"><h2>4 · Consolidación de chunks</h2><span class="tiny">Bloque ${chunkIndex+1}/${execChunks.length}</span></div><p class="muted">Ejecuta este bloque de forma continua. Pulsa cuando termines; registra si hubo una interrupción.</p><div class="chunk"><strong>${escape(p.label)}</strong><div class="alg">${p.moves.map(m=>`<span class="mv">${escape(m)}</span>`).join('')}</div></div><div class="metric" id="chunkTimer">0.0 s</div><div class="row"><button class="primary" id="chunkDone">Bloque completado</button><button id="chunkPause">Me he interrumpido</button></div><p class="tiny">Puedes repetirlo si te has equivocado; una interrupción no penaliza por sí sola, solo informa del punto que necesita práctica.</p></section>`;let timer=setInterval(()=>{let el=$('#chunkTimer');if(!el){clearInterval(timer);return}el.textContent=((performance.now()-chunkStart)/1000).toFixed(1)+' s'},100);$('#chunkDone').onclick=()=>recordChunk(false,timer);$('#chunkPause').onclick=()=>recordChunk(true,timer)}
function recordChunk(interrupted,timer){clearInterval(timer);let ms=Math.round(performance.now()-chunkStart),chunk=execChunks[chunkIndex],p=pOf(current),old=p.chunkStats[chunk.label]||{times:[],interruptions:0,attempts:0};old.times.push(ms);if(old.times.length>20)old.times.shift();old.attempts++;if(interrupted)old.interruptions++;p.chunkStats[chunk.label]=old;p.execMs.push(ms);if(p.execMs.length>50)p.execMs.shift();state.progress[current.key]=p;save();chunkResults.push({label:chunk.label,ms,interrupted});chunkIndex++;showChunk()}
function finishExecution(){let interruptions=chunkResults.filter(x=>x.interrupted).length;app.innerHTML=`<section class="panel"><h2>Resultado de ejecución</h2><p class="muted">Se han medido tus bloques por separado.</p>${chunkResults.map(x=>`<div class="row between"><b>${escape(x.label)}</b><span>${(x.ms/1000).toFixed(2)} s ${x.interrupted?'<span class="bad">· interrupción</span>':''}</span></div>`).join('')}<div class="hint">${interruptions?`${interruptions} bloque(s) con interrupción: conviene repetirlos aislados.`:'Sin interrupciones registradas en esta pasada.'}</div><button class="primary" id="finish">Guardar y terminar</button></section>`;$('#finish').onclick=()=>finishCase()}
function weakCases(){return cases.map(x=>{let p=pOf(x),rec=p.recognitionAttempts?p.recognitionCorrect/p.recognitionAttempts:null,recall=p.recallAttempts?p.recallComplete/p.recallAttempts:null,interrupt=Object.values(p.chunkStats||{}).reduce((a,v)=>a+v.interruptions,0);let reason='seguir aprendiendo';if(rec!==null&&rec<.75)reason='reconocimiento';else if(recall!==null&&recall<.7)reason='recuperación';else if(interrupt>0)reason='ejecución de chunks';return {x,reason,score:(rec!==null?1-rec:0)+(recall!==null?1-recall:0)+interrupt*.15}}).sort((a,b)=>b.score-a.score)}
function startAdaptive(){let ranked=weakCases();let target=ranked.find(v=>v.score>0)?.x||cases.find(x=>!pOf(x).seen)||cases[0];current=target;session=[];derivedFrom=null;startFlow()}
function statsView(){let ps=cases.map(pOf),ra=ps.reduce((a,p)=>a+p.recognitionAttempts,0),rc=ps.reduce((a,p)=>a+p.recognitionCorrect,0),ca=ps.reduce((a,p)=>a+p.recallAttempts,0),cc=ps.reduce((a,p)=>a+p.recallComplete,0);let weak=weakCases().slice(0,10);app.innerHTML=`<section class="panel"><h2>Progreso cognitivo</h2><div class="stats"><div class="stat"><b>${ra?Math.round(rc/ra*100)+'%':'—'}</b><span class="tiny">Reconocimiento</span></div><div class="stat"><b>${ca?Math.round(cc/ca*100)+'%':'—'}</b><span class="tiny">Recuerdo completo</span></div><div class="stat"><b>${ps.reduce((a,p)=>a+p.errors,0)}</b><span class="tiny">Errores registrados</span></div><div class="stat"><b>${ps.filter(p=>p.stage>=5).length}</b><span class="tiny">Consolidados</span></div></div><div class="row"><button id="export">Exportar progreso</button><button id="import">Importar progreso</button><input id="file" type="file" accept="application/json" hidden></div></section><section class="panel"><h2>Qué conviene entrenar</h2>${weak.map(v=>`<div class="row between"><span>${escape(v.x.key)}</span><span class="tiny">${escape(v.reason)}</span><button data-open="${escape(v.x.key)}">Entrenar</button></div>`).join('')}</section><section class="panel"><h2>Estado de integración</h2><p class="tiny">Motor CubIQ: ${window.CM&&typeof window.CM.solvedCube==='function'?'integrado':'no disponible'} · patrones: ${cases.filter(x=>!!realCase(x)?.icon).length} iconos OLL/PLL/EOLL/CPLL/EPLL.</p><p class="tiny">Relaciones de derivación: ${Object.keys(state.relations).length} verificadas/configuradas. No se deducen relaciones por similitud de nombre.</p><p class="tiny">Los tiempos de chunks son mediciones manuales en esta versión; no se atribuyen al cubo inteligente.</p></section>`;$('#export').onclick=()=>download(JSON.stringify(state,null,2),'cubiq-trainer-progreso.json');$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v.progress)throw Error();state={...state,...v};save();show('stats')}catch{alert('Archivo de progreso no válido')}};app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCase(cases.find(x=>x.key===b.dataset.open)))}
function download(s,n){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}
function refreshStats(){let ps=cases.map(pOf),ra=ps.reduce((a,p)=>a+p.recognitionAttempts,0),rc=ps.reduce((a,p)=>a+p.recognitionCorrect,0),ca=ps.reduce((a,p)=>a+p.recallAttempts,0),cc=ps.reduce((a,p)=>a+p.recallComplete,0);$('#due').textContent=due().length;$('#recognition').textContent=ra?Math.round(rc/ra*100)+'%':'—';$('#recall').textContent=ca?Math.round(cc/ca*100)+'%':'—';$('#mastered').textContent=ps.filter(p=>p.stage>=5).length}
$('#reset').onclick=()=>{if(confirm('¿Borrar todo el progreso de CubIQ Trainer?')){state={version:3,progress:{},events:[],relations:{},newPerDay:3};save();show('today')}};
show('today');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
